<div class="rph-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-house-chimney"></i>Roleplay Housing</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="rph-settings-body">
                <div id="rph_open" class="menu_button rph-settings-open">
                    <i class="fa-solid fa-house-chimney-window"></i>
                    <span>Open housing editor</span>
                </div>

                <div class="rph-settings-section">
                    <div class="rph-settings-title"><i class="fa-solid fa-id-card"></i>Character cards</div>
                    <label for="rph_auto_detect">When a chat has no housing yet</label>
                    <select id="rph_auto_detect" class="text_pole">
                        <option value="auto">Read the card automatically</option>
                        <option value="ask">Ask before reading the card</option>
                        <option value="off">Do nothing</option>
                    </select>
                    <small>If the card or your persona mentions a home, it's filled in for you. You can still edit it.</small>
                    <label for="rph_response_length">Max response tokens</label>
                    <input id="rph_response_length" class="text_pole" type="number" inputmode="numeric" min="200" max="8000" step="50" />
                    <small>Used for reading cards and for <b>Flesh out</b>.</small>
                </div>

                <div class="rph-settings-section">
                    <div class="rph-settings-title"><i class="fa-solid fa-syringe"></i>Prompt injection</div>
                    <label class="checkbox_label" for="rph_enabled">
                        <input id="rph_enabled" type="checkbox" />
                        <span>Send housing to the model</span>
                    </label>
                    <label class="checkbox_label" for="rph_include_rooms">
                        <input id="rph_include_rooms" type="checkbox" />
                        <span>Include room-by-room layout</span>
                    </label>
                    <label for="rph_position">Position</label>
                    <select id="rph_position" class="text_pole">
                        <option value="0">After the story string</option>
                        <option value="1">In chat, at depth</option>
                        <option value="2">Before the story string</option>
                    </select>
                    <div class="rph-settings-row">
                        <div>
                            <label for="rph_depth">Depth</label>
                            <input id="rph_depth" class="text_pole" type="number" inputmode="numeric" min="0" max="999" />
                        </div>
                        <div>
                            <label for="rph_role">Role</label>
                            <select id="rph_role" class="text_pole">
                                <option value="0">System</option>
                                <option value="1">User</option>
                                <option value="2">Assistant</option>
                            </select>
                        </div>
                    </div>
                    <label for="rph_template">Template</label>
                    <textarea id="rph_template" class="text_pole textarea_compact" rows="3"></textarea>
                    <small><code>{{housing}}</code> is replaced with the housing details.</small>
                </div>

                <div class="rph-settings-footer">
                    <div id="rph_reset" class="menu_button menu_button_icon">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>Reset settings</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
